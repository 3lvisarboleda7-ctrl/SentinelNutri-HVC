# ============================================================================
# DOCKER COMPOSE DE PRODUCCIÓN — EQUIPO 2 (Servidor Local Windows 10)
# Hardware: Intel Core i7-7700HQ | 16 GB RAM | GPU GTX 1050 4GB | SSD 447GB + HDD 1TB
# SSD: C:/SentinelNutri/ssd/* (Servicios rápidos)
# HDD: D:/SentinelNutri/hdd/* (Archivos crudos, modelos entrenados y respaldos)
# Ollama corre en Windows 10 con aceleración directa GTX 1050 (host.docker.internal:11434)
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelnutri_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sentinelnutri_hvc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${SSD_POSTGRES_DATA:-C:/SentinelNutri/ssd/postgres_data}:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
      - ${HDD_BACKUPS_DIR:-D:/SentinelNutri/hdd/backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinelnutri_hvc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - msv_net

  api_engine:
    build:
      context: ..
      dockerfile: src/sentinelnutri/interfaces/api/Dockerfile
    container_name: sentinelnutri_api_engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://sentinel_user:sentinel_pass_2026@postgres:5432/sentinelnutri_hvc}
      RAW_DATA_DIR: /data/raw
      MODELS_DIR: /data/models
      SHARED_DIRESA_DIR: /data/diresa_ley29733
      ALGEDONIC_DCI_THRESHOLD: ${ALGEDONIC_DCI_THRESHOLD:-0.25}
      REQUIRE_HUMAN_APPROVAL_S3: ${REQUIRE_HUMAN_APPROVAL_S3:-true}
      PRIVACY_ENFORCE_AGGREGATES_ONLY: "true"
      ACADEMIC_USER_AGENT: ${ACADEMIC_USER_AGENT:-SentinelNutri-HVC/1.0 (Proyecto Academico FIIS-UNI)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID_S5_CONSEJO: ${TELEGRAM_CHAT_ID_S5_CONSEJO:-}
      TELEGRAM_CHAT_ID_S3_APROBACION: ${TELEGRAM_CHAT_ID_S3_APROBACION:-}
      TELEGRAM_CHAT_ID_ADMIN_TECH: ${TELEGRAM_CHAT_ID_ADMIN_TECH:-}
    ports:
      - "8000:8000"
    volumes:
      - ${HDD_RAW_DATA:-D:/SentinelNutri/hdd/raw}:/data/raw
      - ${HDD_MODELS_DIR:-D:/SentinelNutri/hdd/models}:/data/models
      - ${HDD_DIRESA_SHARED:-D:/SentinelNutri/hdd/diresa_convenio_ley29733}:/data/diresa_ley29733
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "api_engine:host-gateway"
    networks:
      - msv_net

  n8n:
    image: n8nio/n8n:latest
    container_name: sentinelnutri_n8n_supervisor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      api_engine:
        condition: service_started
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-sentinelnutri_hvc}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-sentinel_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-sentinel_pass_2026}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - TELEGRAM_CHAT_ID_S3_APROBACION=${TELEGRAM_CHAT_ID_S3_APROBACION:-}
      - TELEGRAM_CHAT_ID_S5_CONSEJO_REGIONAL=${TELEGRAM_CHAT_ID_S5_CONSEJO:-}
      - TELEGRAM_CHAT_ID_ADMIN_TECH=${TELEGRAM_CHAT_ID_ADMIN_TECH:-}
      - WEBHOOK_URL=${N8N_PUBLIC_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=America/Lima
      - TZ=America/Lima
    ports:
      - "5678:5678"
    volumes:
      - ${SSD_N8N_DATA:-C:/SentinelNutri/ssd/n8n_data}:/home/node/.n8n
      - ../workflows_n8n:/workflows_import:ro
      - ${HDD_DIRESA_SHARED:-D:/SentinelNutri/hdd/diresa_convenio_ley29733}:/data/diresa_ley29733:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "api_engine:host-gateway"
    networks:
      - msv_net

  dashboard:
    build:
      context: ..
      dockerfile: src/sentinelnutri/interfaces/dashboard/Dockerfile
    container_name: sentinelnutri_streamlit_msv
    restart: unless-stopped
    depends_on:
      api_engine:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://sentinel_user:sentinel_pass_2026@postgres:5432/sentinelnutri_hvc}
      API_ENGINE_URL: http://api_engine:8000
      ALGEDONIC_DCI_THRESHOLD: ${ALGEDONIC_DCI_THRESHOLD:-0.25}
    ports:
      - "8501:8501"
    networks:
      - msv_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sentinelnutri_cloudflare_tunnel
    restart: unless-stopped
    depends_on:
      - n8n
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - msv_net

networks:
  msv_net:
    driver: bridge

