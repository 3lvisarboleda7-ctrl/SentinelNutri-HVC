[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelnutri-hvc"
version = "1.0.0"
description = "Sistema Inteligente de Alerta Temprana para el Sistema 4 del MSV - Región Huancavelica"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Elvis Arboleda", email = "elvis.arboleda@uni.pe" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "playwright>=1.46.0",
    "pdfplumber>=0.11.0",
    "pyreadstat>=1.2.7",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.1",
    "catboost>=1.2.5",
    "shap>=0.46.0",
    "sqlalchemy>=2.0.32",
    "psycopg2-binary>=2.9.9",
    "streamlit>=1.38.0",
    "plotly>=5.23.0",
    "PyYAML>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
]

[tool.ruff]
line-length = 100
target-version = "py311"

