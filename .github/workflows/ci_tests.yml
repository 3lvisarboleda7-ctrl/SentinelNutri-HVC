name: SentinelNutri-HVC CI (Equipo 1 -> Equipo 2)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify-architecture-and-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Unit & Integration Tests (MSV Rules, Ethics, Privacy Ley 29733 & 6 Tools)
        env:
          PYTHONPATH: src
        run: |
          pytest -v

